<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lurup Sicherheitskarte – Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      color: #222;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
    }

    .login-button {
      background: #333;
      color: white;
      width: 100%;
    }

    .approve {
      background: #2e7d32;
      color: white;
    }

    .reject {
      background: #c62828;
      color: white;
    }

    .logout {
      background: #666;
      color: white;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🔐 Lurup Sicherheitskarte – Admin</h1>

  <div id="loginCard" class="card">
    <h2>Admin-Anmeldung</h2>

    <input
      type="email"
      id="email"
      placeholder="E-Mail-Adresse"
    >

    <input
      type="password"
      id="password"
      placeholder="Passwort"
    >

    <button class="login-button" onclick="login()">
      Anmelden
    </button>

    <p id="loginError" class="error"></p>
  </div>

  <div id="adminArea" class="hidden">

    <div class="card">
      <button class="logout" onclick="logout()">
        Abmelden
      </button>
    </div>

    <h2>Offene Meldungen</h2>

    <div id="reports">
      Meldungen werden geladen …
    </div>

  </div>

<script>

  const SUPABASE_URL = "https://otiwdiwsgdxbtguyblso.supabase.co";

  const SUPABASE_KEY = "sb_publishable_ae3zVc4aH5VukTcKch7taQ_aje87ZUP";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  async function login() {

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      document.getElementById("loginError").textContent =
        "Anmeldung fehlgeschlagen. Bitte E-Mail und Passwort prüfen.";

      return;
    }

    document.getElementById("loginCard")
      .classList.add("hidden");

    document.getElementById("adminArea")
      .classList.remove("hidden");

    loadReports();
  }


  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("adminArea")
      .classList.add("hidden");

    document.getElementById("loginCard")
      .classList.remove("hidden");
  }


  async function loadReports() {

    const { data: reports, error } =
      await supabaseClient
        .from("reports")
        .select("*")
        .eq("status", "pending")
        .order("created_at", {
          ascending: false
        });

    const container =
      document.getElementById("reports");

    if (error) {

      container.innerHTML =
        "<p class='error'>Meldungen konnten nicht geladen werden.</p>";

      console.error(error);

      return;
    }

    if (!reports || reports.length === 0) {

      container.innerHTML =
        "<p>🎉 Keine offenen Meldungen.</p>";

      return;
    }

    container.innerHTML = "";

    reports.forEach(report => {

      const card =
        document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <strong>📍 Ort</strong><br>
        Breitengrad: ${report.latitude}<br>
        Längengrad: ${report.longitude}<br><br>

        <strong>Gründe:</strong><br>
        ${report.reasons.join(", ")}<br><br>

        <strong>Kommentar:</strong><br>
        ${report.comment || "Kein Kommentar"}<br><br>

        <button
          class="approve"
          onclick="changeStatus('${report.id}', 'approved')">
          ✅ Freigeben
        </button>

        <button
          class="reject"
          onclick="changeStatus('${report.id}', 'rejected')">
          ❌ Ablehnen
        </button>
      `;

      container.appendChild(card);
    });
  }


  async function changeStatus(id, status) {

    const { error } =
      await supabaseClient
        .from("reports")
        .update({
          status: status
        })
        .eq("id", id);

    if (error) {

      alert(
        "Die Meldung konnte nicht geändert werden."
      );

      console.error(error);

      return;
    }

    loadReports();
  }

</script>

</body>
</html>
